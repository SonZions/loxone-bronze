[Service]
CPUQuota=50%
MemoryHigh=190M
MemoryMax=200M
MemorySwapMax=0
# A WAL-triggered checkpoint can take longer than a normal batch under the
# effective CPU/RAM caps. Killing it every two minutes can prevent completion.
TimeoutStartSec=600
ExecStartPre=/usr/bin/grep -qw memory /sys/fs/cgroup/cgroup.controllers
