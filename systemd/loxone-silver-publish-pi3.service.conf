[Service]
CPUQuota=25%
MemoryHigh=220M
MemoryMax=240M
MemorySwapMax=0
TimeoutStartSec=240
ExecStartPre=/usr/bin/grep -qw memory /sys/fs/cgroup/cgroup.controllers
# EnvironmentFile values override Environment=. Set the actual batch bounds
# in the process invocation while preserving existing credentials and paths.
ExecStart=
ExecStart=/usr/bin/env PUBLISH_MAX_BATCHES=20 PUBLISH_MAX_SECONDS=120 /opt/loxone-local-silver/current/venv/bin/python -m loxone_bronze.silver_publish
