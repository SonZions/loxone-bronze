name: Deploy Loxone Bronze + Silver

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loxone-bronze-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    name: Deploy approved main revision
    runs-on: [self-hosted, Linux, ARM64]
    environment:
      name: loxberry-production
    timeout-minutes: 30

    steps:
      - name: Show approved revision
        run: |
          echo "Approved commit: $GITHUB_SHA"
          echo "The deployment bridge accepts only this exact origin/main commit."

      - name: Require migration-aware deployment bridge
        run: |
          if ! bridge_version="$(/usr/local/sbin/loxone-bronze-deploy --version)" || \
             [[ "$bridge_version" != "loxone-bronze-deploy-v3" ]]; then
            echo "Update /usr/local/sbin/loxone-bronze-deploy from the reviewed main revision first."
            echo "No deployment was started. See docs/silver-operations.md."
            exit 1
          fi

      - name: Deploy through the restricted bridge
        run: sudo -n /usr/local/sbin/loxone-bronze-deploy "$GITHUB_SHA"
