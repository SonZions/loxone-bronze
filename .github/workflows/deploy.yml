name: Deploy Loxone Bronze

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loxone-bronze-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    name: Deploy approved main revision
    runs-on: [self-hosted, Linux, ARM64]
    environment:
      name: loxberry-production
    timeout-minutes: 10

    steps:
      - name: Show approved revision
        run: |
          echo "Approved commit: $GITHUB_SHA"
          echo "The deployment bridge accepts only this exact origin/main commit."

      - name: Deploy through the restricted bridge
        run: sudo -n /usr/local/sbin/loxone-bronze-deploy "$GITHUB_SHA"
