name: Runner smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Raspberry Pi CI
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Host facts
        run: |
          uname -a
          echo
          echo "=== Filesystems ==="
          df -h / /srv/raspi-data
          echo
          echo "=== Runtime ==="
          python3 --version
          git --version

      - name: Compile source
        run: python3 -m compileall -q src

      - name: Run spool unit tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
