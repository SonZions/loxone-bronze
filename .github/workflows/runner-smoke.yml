name: Runner smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Raspberry Pi CI
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Host facts
        run: |
          uname -a
          echo
          echo "=== Filesystems ==="
          df -h / /srv/raspi-data
          echo
          echo "=== Runtime ==="
          python3 --version
          git --version

      - name: Compile source
        run: python3 -m compileall -q src

      - name: Import deployed runtime dependencies
        env:
          PYTHONPATH: src
        # Full tests run on hosted runners; keep the 1 GB production Pi responsive.
        run: /opt/loxone-bronze/venv/bin/python -c "import duckdb; import loxone_bronze.spool; import loxone_bronze.local_silver"
